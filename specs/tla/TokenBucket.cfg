\* EXPECT: pass
\* Safety: the count stays between 0 and 2x the largest capacity, and grants stay within requests.
CONSTANTS
    InitialCapacity = 2
    Capacities      = {1, 3}
    Request         = 2
    ReturnAmount    = 2
    Getters         = {g1, g2}
    Cancellable     = {g1}
    Returners       = {r1}
    Setters         = {s1}
    MaxTicks        = 2
SPECIFICATION Spec
INVARIANT CountNeverNegative
INVARIANT CountAtMostTwiceMaxCapacity
INVARIANT GrantsWithinRequest
