\* EXPECT: pass
\* Liveness: every GetAsync call finishes (granted, cancelled or disposed), including calls waiting for
\* a refill or queued behind one when Dispose() runs, and when a tick lands after Dispose().
CONSTANTS
    InitialCapacity = 1
    Capacities      = {1}
    Request         = 1
    ReturnAmount    = 1
    Getters         = {g1, g2}
    Cancellable     = {g1}
    Returners       = {}
    Setters         = {}
    MaxTicks        = 1
SPECIFICATION Spec
INVARIANT CountNeverNegative
INVARIANT GrantsWithinRequest
PROPERTY EveryRequestFinishes
