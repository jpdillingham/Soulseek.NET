\* EXPECT: violation
\* Accepted behavior: Return reads the active capacity, then the count. If a tick lowers the capacity
\* between the two reads, the count can exceed 2x the new capacity until the next tick. It never exceeds
\* 2x the old capacity (see TokenBucket.cfg).
CONSTANTS
    InitialCapacity = 2
    Capacities      = {1}
    Request         = 2
    ReturnAmount    = 2
    Getters         = {g1}
    Cancellable     = {}
    Returners       = {r1}
    Setters         = {s1}
    MaxTicks        = 2
SPECIFICATION Spec
INVARIANT CountAtMostTwiceActiveCapacity
